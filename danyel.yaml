# Robô automático: varre o Facebook com a sua conta, manda relatório para o
# aprovador no WhatsApp (cópia para o Régis) e só envia o que for aprovado.
robo:
  # modo: "contato_direto" = o relatório leva ao Daniel o link do post e o WhatsApp de cada
  #       pessoa e ELE entra em contato (nada é enviado aos interessados).
  #       "robo_envia" = o Daniel responde APROVO e o robô manda a mensagem.
  modo: "contato_direto"
  # Comenta direto (sem aprovação) nos posts de quem procura casa, pelo Facebook do Daniel,
  # com o WhatsApp dele. Depois manda ao Daniel e ao Régis só os links dos comentários.
  comentar: true
  nota_minima_comentario: 50   # só comenta em post de quem vale a pena
  limite_comentarios_dia: 8
  aprovador_nome: "Aprovador"   # quem recebe o relatório de leads
  aprovador_whatsapp: "5519900000002"
  aprovador_nome_whatsapp: "Aprovador"   # nome do contato como aparece no seu WhatsApp
  copia_whatsapp: ""                   # sem cópia: só o aprovador recebe
  nota_minima: 50                     # filtro: só vai quem vale a pena (nota >= 50, compra/troca/investimento, sem financiamento)
  limite_total_dia: 10                # TRAVA: no máximo 10 mensagens por dia
  limite_facebook_dia: 5              # TRAVA: no máximo 5 delas pelo Messenger
  horario: [8, 20]                    # só envia entre 8h e 20h
  buscas_por_ciclo: 4                 # buscas no Facebook por varredura (ritmo humano)
  avisar_quando_vazio: false          # sem comprador bom = não manda nada

navegador:
  harness: ""                         # vazio = acha sozinho o browser-harness
  # Chrome separado, logado no Facebook do Daniel (abra com "ABRIR FACEBOOK DO DANIEL.bat").
  # A varredura do Facebook usa ele; o WhatsApp continua no seu Chrome.
  facebook_cdp: "http://127.0.0.1:9223"

cerebro:
  ligado: true        # false = usa só regras simples, sem IA
  modelo: ""          # vazio = modelo padrão da sua assinatura do Claude
  timeout_seg: 120

painel:
  porta: 5556
  dias_para_retorno: 2   # lead abordado sem resposta há X dias volta para a lista de retorno

# O que o Danyel está vendendo agora. Pode ter mais de uma oferta.
ofertas:
  - id: casa-cosmopolis
    titulo: "2 casas no mesmo terreno de 440 m² – Jardim Bela Vista III, Cosmópolis/SP"
    preco: "R$ 669.000"
    link: "https://reftavares2025.github.io/casa-cosmopolis/"
    condicoes: >-
      Somente à vista ou com troca + volta em dinheiro (aceita terreno, chácara,
      carro ou imóvel de menor valor). NÃO aceita financiamento bancário nem FGTS.
    resumo: >-
      Terreno de 440 m² com duas casas completas. Frente: 3 dormitórios, sala,
      cozinha, banheiro, garagem coberta. Fundos: 2 dormitórios (1 suíte), sala,
      cozinha, copa, banheiro. Água e luz com medidores separados, portão e
      fechadura eletrônicos, pintura e elétrica recentes, quintal com churrasqueira.
      Perto do Centro, do Hospital e do Clube Cosmopolitano.
    comprador_ideal:
      - "família grande ou que quer morar perto dos pais/filhos, cada um na sua casa"
      - "quem quer morar em uma e alugar a outra (renda de aluguel)"
      - "investidor que compra à vista para renda"
      - "quem tem terreno, chácara, carro ou imóvel menor para dar na troca"
    desqualifica:
      - "só pode comprar financiado / Minha Casa Minha Vida / FGTS"
      - "procura casa para ALUGAR"
      - "orçamento claramente abaixo de R$ 450 mil sem bem para troca"


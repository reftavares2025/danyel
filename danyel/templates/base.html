<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titulo %}Danyel{% endblock %}</title>
<style>
:root{--bg:#f6f6f3;--card:#fff;--ink:#17191e;--mute:#646a78;--line:#e3e3de;--acc:#0f766e;--acc2:#e6f4f2;--warn:#b45309;--bad:#b91c1c;--ok:#15803d}
@media (prefers-color-scheme:dark){:root{--bg:#121417;--card:#1b1e23;--ink:#eceef2;--mute:#9aa1ad;--line:#2b3038;--acc:#2dd4bf;--acc2:#12302d}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--acc)}nav{display:flex;gap:4px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
nav b{margin-right:14px;font-size:17px}nav a{padding:6px 10px;border-radius:8px;text-decoration:none;color:var(--ink)}nav a:hover{background:var(--acc2)}
main{max-width:1100px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
.muted{color:var(--mute)}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;border:1px solid var(--line);background:var(--bg)}
.score{font-weight:800;font-variant-numeric:tabular-nums;min-width:44px;text-align:center;border-radius:8px;padding:4px 6px}
.s-hi{background:#dcfce7;color:#14532d}.s-md{background:#fef3c7;color:#78350f}.s-lo{background:#fee2e2;color:#7f1d1d}.s-na{background:var(--bg);color:var(--mute)}
@media (prefers-color-scheme:dark){.s-hi{background:#14532d;color:#dcfce7}.s-md{background:#78350f;color:#fef3c7}.s-lo{background:#7f1d1d;color:#fee2e2}}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-block}
.btn-p{background:var(--acc);border-color:var(--acc);color:#fff}@media (prefers-color-scheme:dark){.btn-p{color:#06201d}}
textarea,input,select{font:inherit;width:100%;padding:9px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px}label{display:block;font-weight:600;margin:10px 0 4px}
.funil{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.funil a{text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.funil a.on{border-color:var(--acc);box-shadow:0 0 0 2px var(--acc2)}.funil strong{display:block;font-size:22px}
.lead{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;text-decoration:none;color:inherit}
.trecho{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.aviso{border-left:4px solid var(--warn)}.erro{color:var(--bad)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit}
</style>
</head>
<body>
{% if not popup %}
<nav><b>Danyel</b>
<a href="{{ url_for('inicio') }}">Funil</a>
<a href="{{ url_for('cacar') }}">Caçar hoje</a>
<a href="{{ url_for('novo') }}">+ Lead manual</a>
<a href="{{ url_for('exportar') }}">Exportar CSV</a>
</nav>
{% endif %}
<main>{% block corpo %}{% endblock %}</main>
</body>
</html>
